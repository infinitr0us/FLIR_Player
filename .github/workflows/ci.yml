name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: the FLIR File SDK is proprietary and not available in CI, so the
# SDK/recording-dependent tests skip automatically (see tests/conftest.py).
# CI therefore exercises the SDK-independent, pure-logic portion of the suite.
jobs:
  test:
    name: Tests (Windows, Python 3.11)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
